name: Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Start containers for standalone Redis
        run: docker compose up --wait --build --force-recreate --remove-orphans couchbase redis

      - name: Docker status
        run: sleep 60 && docker ps -a && docker logs go-dcp-redis-couchbase-1 && docker logs go-dcp-redis-redis-1

      - name: Integration Test - Standalone Redis
        run: cd test/integration && go test -v -run TestRedisStandalone redis_standalone_integration_test.go common.go

  integration-sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Start containers for Redis Sentinel
        run: docker compose up --wait --build --force-recreate --remove-orphans couchbase redis-master redis-sentinel-1 redis-sentinel-2 redis-sentinel-3

      - name: Docker status
        run: sleep 60 && docker ps -a && docker logs go-dcp-redis-couchbase-1 && docker logs go-dcp-redis-redis-master-1

      - name: Wait for Sentinel
        run: sleep 30 && docker logs go-dcp-redis-redis-sentinel-1-1 && docker logs go-dcp-redis-redis-sentinel-2-1 && docker logs go-dcp-redis-redis-sentinel-3-1

      - name: Integration Test - Redis Sentinel
        run: cd test/integration && go test -v -run TestRedisSentinel redis_sentinel_integration_test.go common.go
        env:
          INPUT_PUBLISH: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Start containers for Redis Cluster
        run: docker compose up --wait --build --force-recreate --remove-orphans couchbase redis-cluster-1 redis-cluster-2 redis-cluster-3 redis-cluster-4 redis-cluster-5 redis-cluster-6 redis-cluster-init

      - name: Docker status
        run: sleep 60 && docker ps -a && docker logs go-dcp-redis-couchbase-1 && docker logs go-dcp-redis-redis-cluster-1-1

      - name: Wait for Cluster
        run: sleep 30 && docker logs go-dcp-redis-redis-cluster-1-1 && docker logs go-dcp-redis-redis-cluster-2-1 && docker logs go-dcp-redis-redis-cluster-3-1 && docker logs go-dcp-redis-redis-cluster-4-1 && docker logs go-dcp-redis-redis-cluster-5-1 && docker logs go-dcp-redis-redis-cluster-6-1

      - name: Integration Test - Redis Cluster
        run: cd test/integration && go test -v -run TestRedisCluster redis_cluster_integration_test.go common.go
        env:
          INPUT_PUBLISH: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-multi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Start containers for multiple Redis instances
        run: docker compose up --wait --build --force-recreate --remove-orphans couchbase redis redis-master

      - name: Docker status
        run: sleep 60 && docker ps -a && docker logs go-dcp-redis-couchbase-1 && docker logs go-dcp-redis-redis-1 && docker logs go-dcp-redis-redis-master-1

      - name: Integration Test - Multiple Redis Instances
        run: cd test/integration && go test -v -run TestRedisMultiInstance redis_multi_integration_test.go common.go